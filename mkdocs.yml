site_name: TMD Library
site_url: https://etstribology.github.io/TrueMapData/
site_description: TrueMap Data (TMD) file processing library
site_author: Antoine Gagnon
repo_url: https://github.com/ETSTribology/TrueMapData
repo_name: ETSTribology/TrueMapData

nav:
  - Home: index.md
  - User Guide:
      - Installation: user-guide/installation.md
      - Getting Started: user-guide/getting-started.md
      - Working with TMD Files: user-guide/working-with-tmd-files.md
      - Visualization: user-guide/visualization.md
      - Exporting Data: user-guide/exporting-data.md
  - License: https://github.com/ETSTribology/TrueMapData/blob/main/LICENSE

theme:
  name: material
  palette:
    primary: blue
    accent: teal
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ETSTribology
      name: ETSTribology on GitHub

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
