name: Dependency submission

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Required for the dependency submission API (see actions/component-detection-dependency-submission-action).
permissions:
  contents: write
  id-token: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Root requirements.txt pulls a very large optional stack and duplicates resolution from
      # setup.py / pyproject.toml. Stash it so PipReport focuses on installable package manifests.
      - name: Stash broad requirements for graph scan
        run: |
          mkdir -p .graph-scan-stash
          if [ -f requirements.txt ]; then
            mv requirements.txt .graph-scan-stash/requirements.txt
          fi

      # Pin to upstream merge commit (includes Node 24 runner); GitHub's snapshot API often
      # returns 5xx / "try again later" — retry a few times, then do not fail the workflow.
      - name: Submit dependencies to GitHub
        id: submit
        continue-on-error: true
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/component-detection-dependency-submission-action@98beaea5a1227f3db476e4c9ca959a0cacd7ac4f
          with: |
            detectorsFilter: PipReport
            detectorsCategories: Python
            directoryExclusionList: .graph-scan-stash
          attempt_limit: 5
          attempt_delay: 20000

      - name: Report submission failure
        if: steps.submit.outcome == 'failure'
        run: |
          echo "::warning::Dependency snapshot upload failed after retries (often a transient GitHub API error). Re-run this workflow; the job stays green because submission uses continue-on-error."
